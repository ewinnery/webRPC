<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebRPC</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <img src="icons/icon-32.png" class="logo-icon" alt="">
        <span class="logo-text">WebRPC</span>
      </div>
      <div class="header-actions">
        <button class="header-btn" id="refreshBtn" title="Refresh">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
        <div class="connection-pill" id="connectionPill">
          <span class="connection-dot" id="headerDot"></span>
          <span class="connection-label" id="headerLabel">Offline</span>
        </div>
      </div>
    </header>

    <div class="download-section" id="updateSection" style="display:none">
      <div class="download-card">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--accent);margin-bottom:8px">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <h3>Update Available</h3>
        <p>New version v<span id="updateVer">1.0.1</span> is available</p>
        <button id="updateAutoBtn" class="btn btn-primary btn-full">Update</button>
        <span class="download-status" id="updateLaterBtn" style="cursor:pointer;margin-top:12px;display:inline-block">Remind me later</span>
      </div>
    </div>

    <div class="download-section" id="downloadSection">
      <div class="download-card">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--accent);margin-bottom:8px">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <h3>Desktop Client Required</h3>
        <p>Download the client to bridge browser → Discord</p>
        <button id="downloadBtn" class="btn btn-primary btn-full">Download</button>
        <span class="download-status" id="downloadStatus">Already have it? Click to connect</span>
      </div>
    </div>

    <div class="main-content" id="mainContent" style="display:none">
      <div class="tabs">
        <button class="tab active" data-tab="activity">Activity</button>
        <button class="tab" data-tab="settings">Settings</button>
      </div>

      <div class="tab-content">
        <div class="tab-pane active" id="activityTab">
          <div class="discord-card">
            <div class="discord-card-images">
              <div class="discord-large-img" id="discordLargeImg">
                <img id="discordLargeImgSrc" src="" alt="">
                <div class="discord-large-fallback" id="discordLargeFallback">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                  </svg>
                </div>
              </div>
              <div class="discord-card-text">
                <div class="discord-card-name" id="discordName">WebRPC</div>
                <div class="discord-card-details" id="discordDetails">Browsing</div>
                <div class="discord-card-state" id="discordState"></div>
                <div class="discord-card-time" id="discordTime"></div>
              </div>
            </div>
          </div>

          <div class="activity-info-card">
            <div class="activity-info-row">
              <span class="activity-info-label">Type</span>
              <span class="activity-type-badge" id="activityType">page</span>
            </div>
            <div class="activity-info-row">
              <span class="activity-info-label">Page</span>
              <span class="activity-info-value truncate" id="activityTitle">—</span>
            </div>
            <div class="activity-info-row" id="activityDetailsRow">
              <span class="activity-info-label">Details</span>
              <span class="activity-info-value" id="activityDetails"></span>
            </div>
            <div class="activity-info-row" id="activityStateRow">
              <span class="activity-info-label">State</span>
              <span class="activity-info-value" id="activityState"></span>
            </div>
            <div class="activity-info-row">
              <span class="activity-info-label">Site</span>
              <span class="activity-info-value" id="activitySite"></span>
            </div>
          </div>
        </div>

        <div class="tab-pane" id="settingsTab">
          <div class="settings-group">
            <h4 class="settings-group-title">Theme</h4>
            <div class="theme-selector" id="themeSelector">
              <button class="theme-btn active" data-theme="dark"><span class="theme-dot"></span>Orange</button>
              <button class="theme-btn" data-theme="neutral"><span class="theme-dot"></span>Dark</button>
              <button class="theme-btn" data-theme="light"><span class="theme-dot"></span>Light</button>
              <button class="theme-btn" data-theme="discord"><span class="theme-dot"></span>Discord</button>
            </div>
          </div>

          <div class="settings-group">
            <h4 class="settings-group-title">Display</h4>
            <div class="setting-item">
              <label class="setting-label">Detailed Info</label>
              <label class="toggle-switch"><input type="checkbox" id="showDetailedInfo" checked><span class="toggle-slider"></span></label>
            </div>
            <div class="setting-item">
              <label class="setting-label">Page Title</label>
              <label class="toggle-switch"><input type="checkbox" id="showPageTitle" checked><span class="toggle-slider"></span></label>
            </div>
            <div class="setting-item">
              <label class="setting-label">Video Duration</label>
              <label class="toggle-switch"><input type="checkbox" id="showVideoDuration" checked><span class="toggle-slider"></span></label>
            </div>
          </div>

          <div class="settings-group">
            <h4 class="settings-group-title">Buttons</h4>
            <div class="setting-item">
              <label class="setting-label">Show Buttons</label>
              <label class="toggle-switch"><input type="checkbox" id="showButtons" checked><span class="toggle-slider"></span></label>
            </div>
            <div class="setting-item">
              <label class="setting-label">Watch Video</label>
              <label class="toggle-switch"><input type="checkbox" id="showWatchButton" checked><span class="toggle-slider"></span></label>
            </div>
            <div class="setting-item">
              <label class="setting-label">View Channel</label>
              <label class="toggle-switch"><input type="checkbox" id="showChannelButton" checked><span class="toggle-slider"></span></label>
            </div>
          </div>

          <div class="settings-group">
            <h4 class="settings-group-title">Hidden Pages</h4>
            <div class="hidden-pages-list" id="hiddenPagesList"></div>
            <div class="add-hidden-page">
              <input type="text" id="newHiddenPage" placeholder="URL or pattern...">
              <button id="addHiddenPageBtn" class="btn btn-small btn-secondary">+</button>
            </div>
          </div>

          <div class="settings-group">
            <h4 class="settings-group-title">Connection</h4>
            <div class="setting-item">
              <label class="setting-label">Port</label>
              <input type="number" id="clientPort" value="8765" min="1024" max="65535" class="port-input">
            </div>
            <button id="reconnectBtn" class="btn btn-secondary btn-full" style="margin-top:6px">Reconnect</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
